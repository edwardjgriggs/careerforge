name: Bug report
description: Something behaved differently from what it says it does.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real evidence, transcripts, credentials, or client names into an issue.**
        If reproducing needs data, describe its shape or construct a synthetic example.

        Security problems do not go here — see [SECURITY.md](https://github.com/edwardjgriggs/careerforge/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, and what came out.
      placeholder: |
        $ careerforge group
        ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: '`careerforge doctor` output'
      description: >-
        Doctor reports your Node version, the store, the schema, and what has run.
        Redact anything you would not post publicly — paths often contain your name.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CareerForge version
      description: '`careerforge --version`'
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >-
        A minimal reproduction, a fixture that triggers it, or the ADR you think
        this contradicts.
