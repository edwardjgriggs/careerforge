version: 2

# A tool that reads commit history and coding transcripts and holds AI provider keys
# should not be running a dependency set nobody is watching. The runtime dependency
# surface is deliberately tiny, so this stays quiet — which is the point: when it does
# open a PR, it means something.
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for the toolchain rather than six. These move together and are verified
      # by the same `npm run verify` either way.
      dev-tooling:
        dependency-type: development
        patterns: ['*']
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps(dev)'
    labels: ['dependencies']
    # Both of these were proposed, tested by CI, and refused on the evidence.
    # They are recorded here with the reason so that the next person — or the
    # next version of me — does not spend an afternoon rediscovering it.
    ignore:
      # Retested at 13.0.2 in PR #24 and still red on windows/node 22. The cause
      # is npm, not this package. 13.x bundles prebuilds/win32-x64.node and sets
      # "gypfile": false, which is exactly the field that should stop npm running
      # node-gyp for a package containing binding.gyp. npm ignores it -
      # npm/cli#3341, open since 2021. So npm attempts a source build for a
      # package that already contains the binary it would produce, and on node 22
      # (npm 10) that build reaches node-gyp 11.5.0, which cannot parse the
      # runner's Visual Studio 18. node 24 escapes only because npm 11's
      # allow-scripts gate declines the implicit script.
      #
      # Held at 12.x deliberately, and not worked around in CI on purpose: the
      # same implicit build runs for anyone installing on Windows with npm 10, so
      # a green verify job would be hiding a break rather than proving it absent.
      #
      # Beware the false positive that got PR #24 merged: `npm install` over an
      # existing node_modules succeeds without invoking node-gyp. Only a clean
      # install tells the truth, and that is what users and CI perform.
      #
      # Revisit when npm fixes npm/cli#3341, or when the Node floor reaches a
      # version whose bundled npm is 11+. Nothing upstream remains to be done.
      - dependency-name: better-sqlite3
        versions: ['13.x']
      # typescript-eslint 8.x peer-depends on a TypeScript range that 7.x is
      # outside, so `npm ci` fails ERESOLVE before a single test runs. Revisit
      # when typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        versions: ['7.x']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
    labels: ['dependencies', 'ci']
