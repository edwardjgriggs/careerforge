name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # So the release workflow can require a green matrix on all three platforms
  # before anything is published, rather than trusting that it was green.
  workflow_call:

permissions:
  contents: read

# Every third-party action is pinned to a commit SHA rather than a moving tag. A tag can
# be repointed by whoever owns it, and this repository's release workflow runs alongside a
# job holding a registry credential. A project that asks people to verify what it publishes
# should not itself be running code it cannot name. Dependabot proposes the bumps, and each
# one arrives as a reviewable diff.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary development platform and the least-tested
        # target in most open-source projects. It is a first-class matrix
        # entry from the first commit, not something added after a bug report.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 22 is the documented minimum (ADR-0014: better-sqlite3 requires it,
        # and node:sqlite does not exist on 20). 24 is the forward check.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint (includes architectural boundary rules)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Test
        run: npm test

      # The CLI must actually run from build output, not merely compile.
      - name: Smoke test the CLI
        run: node packages/cli/dist/bin.js doctor
        env:
          # Point at a directory that exists so doctor reports a clean run.
          CAREERFORGE_HOME: ${{ runner.temp }}

      # The fresh-machine test, and the one that prevents "works on my
      # machine" — the most common way a project loses its first hundred
      # users on a platform the maintainer does not run. The tour drives the
      # real commands end to end: collect, group, generate, refuse, interview,
      # regenerate, preview, consent, review. If it completes, a stranger on
      # this platform can complete it too.
      - name: Walk the guided tour from a clean install
        run: node packages/cli/dist/bin.js tour --no-pause
        env:
          CAREERFORGE_HOME: ${{ runner.temp }}/tour-home
          # Deliberately absent. The tour must work for somebody who has not
          # decided to trust this with a credential yet.
          OPENAI_API_KEY: ''

  no-api-key:
    name: builds and tests with no AI credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # ADR-0005: AI is additive. The full suite must pass with no provider
      # credentials in the environment, or "AI is never required" is a slogan.
      - name: Verify with an empty credential environment
        run: npm run verify
        env:
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          GOOGLE_API_KEY: ''
