name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary development platform and the least-tested
        # target in most open-source projects. It is a first-class matrix
        # entry from the first commit, not something added after a bug report.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 20.11 is the documented minimum; 22 is the development runtime.
        node: ['20.11', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint (includes architectural boundary rules)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Test
        run: npm test

      # The CLI must actually run from build output, not merely compile.
      - name: Smoke test the CLI
        run: node packages/cli/dist/bin.js doctor
        env:
          # Point at a directory that exists so doctor reports a clean run.
          CAREERFORGE_HOME: ${{ runner.temp }}

  no-api-key:
    name: builds and tests with no AI credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # ADR-0005: AI is additive. The full suite must pass with no provider
      # credentials in the environment, or "AI is never required" is a slogan.
      - name: Verify with an empty credential environment
        run: npm run verify
        env:
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          GOOGLE_API_KEY: ''
