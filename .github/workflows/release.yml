name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# A release is a claim that this code works on the platforms it says it does.
# The verify matrix has to pass on all three before anything is published, and
# the artifact carries checksums so somebody downloading it can check they got
# what was built rather than trusting the transport.
permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  package:
    name: package and checksum
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Pack the workspace
        run: |
          mkdir -p dist-release
          npm pack --workspaces --pack-destination dist-release

      # SHA-256 beside every artifact. A download nobody can verify is a
      # download nobody should run, and this is the cheapest possible way to
      # make verification available.
      - name: Checksums
        working-directory: dist-release
        run: sha256sum *.tgz | tee SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: careerforge-release
          path: dist-release/

      # Install what was just packed, with the network switched off, and walk
      # the tour with it. This is the check that would have caught the release
      # artifacts being unusable: every package resolving from the tarballs
      # rather than from a registry proves the dependency set is complete, and
      # the tour proves the thing a stranger runs first actually runs.
      # `--offline` below is the assertion, so the cache has to hold the third
      # party dependencies before it runs — otherwise the step fails on
      # better-sqlite3 and proves nothing about our own tarballs. The spec list
      # is read out of the workspace manifests rather than written down here, so
      # adding a runtime dependency cannot silently weaken the check.
      - name: Warm the cache with third-party runtime dependencies
        run: |
          node -e '
            const fs = require("fs");
            const dirs = ["packages", "collectors"].flatMap((root) =>
              fs.readdirSync(root).map((d) => root + "/" + d),
            );
            const specs = new Set();
            for (const dir of dirs) {
              const manifest = dir + "/package.json";
              if (!fs.existsSync(manifest)) continue;
              const deps = JSON.parse(fs.readFileSync(manifest, "utf8")).dependencies ?? {};
              for (const [name, range] of Object.entries(deps)) {
                if (!name.startsWith("@careerforge/")) specs.add(name + "@" + range);
              }
            }
            console.log([...specs].join("\n"));
          ' > "$RUNNER_TEMP/third-party.txt"
          cat "$RUNNER_TEMP/third-party.txt"
          # A real install, not `npm cache add` — the latter caches the named
          # package and none of its dependency tree, which leaves `--offline`
          # failing one level further down.
          xargs -r npm install --prefix "$RUNNER_TEMP/warm" < "$RUNNER_TEMP/third-party.txt"

      # The `./` is load-bearing. npm treats a bare `dist-release/foo.tgz` as the
      # GitHub shorthand `owner/repo` and goes looking for it over SSH; only a
      # path beginning `./`, `../`, or `/` is read as a local tarball. This step
      # failed on exactly that the first time it ever ran, which is the argument
      # for the step existing: docs/install.md has always told users `./*.tgz`,
      # and the release pipeline was the one place getting it wrong.
      #
      # With the cache warm, `--offline` now means what it is here to mean: not
      # one `@careerforge` package was fetched, so the tarball set is complete
      # and a stranger installing this release will not be sent to a registry
      # looking for something that is not there.
      - name: Install the artifacts offline and walk the tour
        run: |
          npm install -g --offline --prefix "$RUNNER_TEMP/pfx" ./dist-release/*.tgz
          "$RUNNER_TEMP/pfx/bin/careerforge" --version
          "$RUNNER_TEMP/pfx/bin/careerforge" tour --no-pause
        env:
          CAREERFORGE_HOME: ${{ runner.temp }}/release-tour-home
          OPENAI_API_KEY: ''

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist-release/*.tgz
            dist-release/SHA256SUMS
          body: |
            Pre-1.0. The plugin protocol (`@careerforge/protocol`) is
            **unstable** and will change without a major version bump until
            1.0. Everything else follows semver from 0.2.0.

            Verify your download:

                sha256sum -c SHA256SUMS

  # Publishing is a separate job so that a registry credential problem cannot
  # leave a half-published set behind a green release, and so the packing job
  # stays runnable by anyone without secrets.
  publish:
    name: publish to npm
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance. npm records which workflow, which commit, and which
      # repository produced each tarball, and anyone can verify it after the
      # fact. A tool that asks people to let it read their commit history and
      # their coding transcripts should be able to prove what it shipped came
      # from the source they can read.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build

      - name: Publish
        run: npm publish --workspaces --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
