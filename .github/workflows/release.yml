name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# A release is a claim that this code works on the platforms it says it does.
# The verify matrix has to pass on all three before anything is published, and
# the artifact carries checksums so somebody downloading it can check they got
# what was built rather than trusting the transport.
permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  package:
    name: package and checksum
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Pack the workspace
        run: |
          mkdir -p dist-release
          npm pack --workspaces --pack-destination dist-release

      # SHA-256 beside every artifact. A download nobody can verify is a
      # download nobody should run, and this is the cheapest possible way to
      # make verification available.
      - name: Checksums
        working-directory: dist-release
        run: sha256sum *.tgz | tee SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: careerforge-release
          path: dist-release/

      # Install what was just packed, with the network switched off, and walk
      # the tour with it. This is the check that would have caught the release
      # artifacts being unusable: every package resolving from the tarballs
      # rather than from a registry proves the dependency set is complete, and
      # the tour proves the thing a stranger runs first actually runs.
      - name: Install the artifacts offline and walk the tour
        run: |
          npm install -g --offline --prefix "$RUNNER_TEMP/pfx" dist-release/*.tgz
          "$RUNNER_TEMP/pfx/bin/careerforge" --version
          "$RUNNER_TEMP/pfx/bin/careerforge" tour --no-pause
        env:
          CAREERFORGE_HOME: ${{ runner.temp }}/release-tour-home
          OPENAI_API_KEY: ''

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist-release/*.tgz
            dist-release/SHA256SUMS
          body: |
            Pre-1.0. The plugin protocol (`@careerforge/protocol`) is
            **unstable** and will change without a major version bump until
            1.0. Everything else follows semver from 0.2.0.

            Verify your download:

                sha256sum -c SHA256SUMS

  # Publishing is a separate job so that a registry credential problem cannot
  # leave a half-published set behind a green release, and so the packing job
  # stays runnable by anyone without secrets.
  publish:
    name: publish to npm
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance. npm records which workflow, which commit, and which
      # repository produced each tarball, and anyone can verify it after the
      # fact. A tool that asks people to let it read their commit history and
      # their coding transcripts should be able to prove what it shipped came
      # from the source they can read.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build

      - name: Publish
        run: npm publish --workspaces --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
