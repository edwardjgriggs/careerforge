<text x="287" y="19.5" text-anchor="middle" fill="#9aa3b2" font-size="11">careerforge</text>
<text class="r0" y="52" xml:space="preserve"><tspan x="26.0" textLength="16.8" lengthAdjust="spacing" fill="#9aa3b2">$ </tspan><tspan x="42.8" textLength="285.6" lengthAdjust="spacing" fill="#e6e8ec">careerforge generate resume-bullet</tspan></text>
<text class="r2" y="92" xml:space="preserve"><tspan x="26.0" textLength="512.4" lengthAdjust="spacing" fill="#9aa3b2">Work unit: Working out why the nightly export kept timing out</tspan></text>
<text class="r3" y="112" xml:space="preserve"><tspan x="26.0" textLength="184.8" lengthAdjust="spacing" fill="#9aa3b2">Reading:   6 record(s)</tspan></text>
<text class="r5" y="152" xml:space="preserve"><tspan x="26.0" textLength="403.2" lengthAdjust="spacing" fill="#e6e8ec">Rebuilt the nightly export to run incrementally.</tspan></text>
<text class="r7" y="192" xml:space="preserve"><tspan x="26.0" textLength="386.4" lengthAdjust="spacing" fill="#9aa3b2">Every part of that, and what stands behind it:</tspan></text>
<text class="r9" y="232" xml:space="preserve"><tspan x="26.0" textLength="92.4" lengthAdjust="spacing" fill="#7ec699">  action   </tspan><tspan x="118.4" textLength="394.8" lengthAdjust="spacing" fill="#e6e8ec">Rebuilt the nightly export to run incrementally</tspan></text>
<text class="r10" y="252" xml:space="preserve"><tspan x="26.0" textLength="520.8" lengthAdjust="spacing" fill="#9aa3b2">           cites 3 records, from git and from a coding session</tspan></text>
<text class="r12" y="292" xml:space="preserve"><tspan x="26.0" textLength="75.6" lengthAdjust="spacing" fill="#e0af68">Left out </tspan><tspan x="101.6" textLength="294.0" lengthAdjust="spacing" fill="#9aa3b2">- the evidence does not carry them:</tspan></text>
<text class="r14" y="332" xml:space="preserve"><tspan x="26.0" textLength="92.4" lengthAdjust="spacing" fill="#f7768e">  role     </tspan><tspan x="118.4" textLength="344.4" lengthAdjust="spacing" fill="#e6e8ec">&quot;led the redesign of the export pipeline&quot;</tspan></text>
<rect class="k14" x="118.4" y="328.0" width="344.4" height="1.6" fill="#f7768e"/>
<text class="r15" y="352" xml:space="preserve"><tspan x="26.0" textLength="495.6" lengthAdjust="spacing" fill="#9aa3b2">           Leadership and responsibility cannot be inferred</tspan></text>
<text class="r16" y="372" xml:space="preserve"><tspan x="26.0" textLength="210.0" lengthAdjust="spacing" fill="#9aa3b2">           from activity.</tspan></text>
<text class="r17" y="392" xml:space="preserve"><tspan x="26.0" textLength="420.0" lengthAdjust="spacing" fill="#7aa2f7">           -&gt; What was your role? Did you lead it?</tspan></text>
<text class="r19" y="432" xml:space="preserve"><tspan x="26.0" textLength="92.4" lengthAdjust="spacing" fill="#f7768e">  metric   </tspan><tspan x="118.4" textLength="235.2" lengthAdjust="spacing" fill="#e6e8ec">&quot;cutting export time by 80%&quot;</tspan></text>
<rect class="k19" x="118.4" y="428.0" width="235.2" height="1.6" fill="#f7768e"/>
<text class="r20" y="452" xml:space="preserve"><tspan x="26.0" textLength="520.8" lengthAdjust="spacing" fill="#9aa3b2">           Numbers must be computed from evidence or confirmed</tspan></text>
<text class="r21" y="472" xml:space="preserve"><tspan x="26.0" textLength="512.4" lengthAdjust="spacing" fill="#9aa3b2">           by you. CareerForge will ask rather than estimate.</tspan></text>
<text class="r22" y="492" xml:space="preserve"><tspan x="26.0" textLength="470.4" lengthAdjust="spacing" fill="#7aa2f7">           -&gt; Did this work produce a measurable result?</tspan></text>
<text class="r24" y="532" xml:space="preserve"><tspan x="26.0" textLength="92.4" lengthAdjust="spacing" fill="#f7768e">  outcome  </tspan><tspan x="118.4" textLength="336.0" lengthAdjust="spacing" fill="#e6e8ec">&quot;eliminating the nightly timeout alerts&quot;</tspan></text>
<rect class="k24" x="118.4" y="528.0" width="336.0" height="1.6" fill="#f7768e"/>
<text class="r25" y="552" xml:space="preserve"><tspan x="26.0" textLength="520.8" lengthAdjust="spacing" fill="#9aa3b2">           The evidence records the work, not what came of it.</tspan></text>
<text class="r26" y="572" xml:space="preserve"><tspan x="26.0" textLength="478.8" lengthAdjust="spacing" fill="#9aa3b2">           An outcome has to be observed, never inferred.</tspan></text>
<text class="r27" y="592" xml:space="preserve"><tspan x="26.0" textLength="512.4" lengthAdjust="spacing" fill="#7aa2f7">           -&gt; What actually changed as a result of this work?</tspan></text>
<text class="r29" y="632" xml:space="preserve"><tspan x="26.0" textLength="193.2" lengthAdjust="spacing" fill="#7ec699">Evidence: corroborated </tspan><tspan x="219.2" textLength="235.2" lengthAdjust="spacing" fill="#9aa3b2">- 3 records from 2 source(s)</tspan></text>
<text class="r30" y="652" xml:space="preserve"><tspan x="26.0" textLength="462.0" lengthAdjust="spacing" fill="#e0af68">  Left out for want of evidence: metric, outcome, role.</tspan></text>
<rect class="cur" x="328.4" y="41.0" width="8" height="15" fill="#7aa2f7"/>
</svg>
